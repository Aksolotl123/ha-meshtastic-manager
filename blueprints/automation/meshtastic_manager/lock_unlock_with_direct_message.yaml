blueprint:
  name: Meshtastic - unlock with a direct message
  description: >-
    Unlocks a lock when a chosen Meshtastic radio sends the open word as an
    encrypted direct message (PKI, firmware 2.5+) to the Home Assistant radio.
    Only PKI direct messages are accepted: they are encrypted and
    authenticated with the keys of the two radios, so nobody else can forge
    them, even with the channel keys. A recorded message transmitted again
    later is ignored too (Meshtastic Manager 0.2.0+ remembers received
    packets). Channel messages and direct messages without PKI are ignored.
  domain: automation
  author: Meshtastic Manager
  source_url: https://github.com/Aksolotl123/ha-meshtastic-manager/blob/main/blueprints/automation/meshtastic_manager/lock_unlock_with_direct_message.yaml
  input:
    radio:
      name: Home Assistant radio
      selector:
        config_entry:
          integration: meshtastic_manager
    sender:
      name: Allowed sender
      description: Node ID of the radio you carry, for example !a1b2c3d4.
      selector:
        text:
    lock_entity:
      name: Lock
      selector:
        entity:
          domain: lock
    open_words:
      name: Open command
      description: Accepted words (case is ignored).
      default:
        - otwórz
        - otworz
        - open
      selector:
        text:
          multiple: true
    relock_minutes:
      name: Lock again after
      description: 0 = do not lock automatically.
      default: 5
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: min
    notify:
      name: Notification
      description: >-
        Actions run after unlocking and after locking again. The text is in
        the variable notify_message, e.g. message: "{{ notify_message }}".
      default: []
      selector:
        action: {}

# A new open command while waiting to lock again unlocks once more and
# starts the timer from the beginning.
mode: restart

variables:
  radio: !input radio
  sender: !input sender
  lock_entity: !input lock_entity
  open_words: !input open_words
  relock_minutes: !input relock_minutes

triggers:
  - trigger: event
    event_type: meshtastic_manager_message
    event_data:
      entry_id: !input radio
      from: !input sender
      direct: true
      pki: true

conditions:
  - alias: Open word
    condition: template
    value_template: >-
      {{ (trigger.event.data.text | trim | lower) in (open_words | map('lower') | list) }}

actions:
  - action: lock.unlock
    target:
      entity_id: !input lock_entity
    continue_on_error: true
  - delay:
      seconds: 3
  - action: meshtastic_manager.send_text
    data:
      config_entry_id: "{{ radio }}"
      to: "{{ sender }}"
      text: >-
        {{ 'Otwarto' if is_state(lock_entity, 'unlocked') else 'Błąd: zamek ' ~ states(lock_entity) }}
  - variables:
      notify_message: "Meshtastic: {{ trigger.event.data.from_name or sender }} otworzył(a) {{ state_attr(lock_entity, 'friendly_name') }} (stan: {{ states(lock_entity) }})."
  - choose: []
    default: !input notify
  - if:
      - condition: template
        value_template: "{{ relock_minutes | int(0) > 0 }}"
    then:
      - delay:
          minutes: "{{ relock_minutes | int }}"
      - if:
          - condition: template
            value_template: "{{ is_state(lock_entity, 'unlocked') }}"
        then:
          - action: lock.lock
            target:
              entity_id: !input lock_entity
            continue_on_error: true
          - action: meshtastic_manager.send_text
            data:
              config_entry_id: "{{ radio }}"
              to: "{{ sender }}"
              text: "Zamknięto automatycznie"
          - variables:
              notify_message: "Meshtastic: {{ state_attr(lock_entity, 'friendly_name') }} zamknięty automatycznie po {{ relock_minutes }} min."
          - choose: []
            default: !input notify
