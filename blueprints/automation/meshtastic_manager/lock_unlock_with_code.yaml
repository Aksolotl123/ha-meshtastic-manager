blueprint:
  name: Meshtastic - unlock with a one-time code
  description: >-
    Unlocks a lock when a chosen Meshtastic radio sends the open word and then
    answers the random code (4-6 digits) Home Assistant sends back. A recorded
    or replayed message cannot open the lock because the code changes every
    time, and each code accepts only one answer.
    Only encrypted direct messages (PKI, firmware 2.5+) to the Home Assistant
    radio are accepted, both for the open word and for the code: they prove who
    the sender is and nobody else can read the code. Channel messages and
    direct messages without PKI are ignored and do not use up the attempt.
  domain: automation
  author: Meshtastic Manager
  source_url: https://github.com/Aksolotl123/ha-meshtastic-manager/blob/main/blueprints/automation/meshtastic_manager/lock_unlock_with_code.yaml
  input:
    radio:
      name: Home Assistant radio
      selector:
        config_entry:
          integration: meshtastic_manager
    sender:
      name: Allowed sender
      description: Node ID of the radio you carry, for example !a1b2c3d4.
      selector:
        text:
    lock_entity:
      name: Lock
      selector:
        entity:
          domain: lock
    open_words:
      name: Open command
      description: Accepted words (case is ignored).
      default:
        - otwórz
        - otworz
        - open
      selector:
        text:
          multiple: true
    code_length:
      name: Code length
      description: Number of digits of the one-time code.
      default: 6
      selector:
        number:
          min: 4
          max: 6
          mode: box
    code_timeout:
      name: Time to answer the code
      default: 90
      selector:
        number:
          min: 30
          max: 300
          unit_of_measurement: s
    relock_minutes:
      name: Lock again after
      description: 0 = do not lock automatically.
      default: 5
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: min
    notify:
      name: Notification
      description: >-
        Actions run on every attempt. The text is in the variable
        notify_message, e.g. message: "{{ notify_message }}".
      default: []
      selector:
        action: {}

mode: single
max_exceeded: silent

variables:
  radio: !input radio
  sender: !input sender
  lock_entity: !input lock_entity
  open_words: !input open_words
  code_length: !input code_length
  code_timeout: !input code_timeout
  relock_minutes: !input relock_minutes

triggers:
  - trigger: event
    event_type: meshtastic_manager_message
    event_data:
      entry_id: !input radio
      from: !input sender
      direct: true
      pki: true

conditions:
  - alias: Open word
    condition: template
    value_template: >-
      {{ (trigger.event.data.text | trim | lower) in (open_words | map('lower') | list) }}

actions:
  - variables:
      # The template sandbox limits range() to 100000 items, so 6 digits are
      # built from two parts. The first digit is never 0, so the code keeps
      # its length when Home Assistant turns it into a number.
      code: "{% set n = code_length | int(6) %}{% if n <= 5 %}{{ range(10 ** (n - 1), 10 ** n) | random }}{% else %}{{ (range(100, 1000) | random) ~ ('%03d' % (range(1000) | random)) }}{% endif %}"
      who: "{{ trigger.event.data.from_name or sender }}"
  - action: meshtastic_manager.send_text
    data:
      config_entry_id: "{{ radio }}"
      to: "{{ sender }}"
      text: "Kod: {{ code }} ({{ code_timeout }} s)"
  - variables:
      notify_message: "Meshtastic: {{ who }} prosi o otwarcie ({{ state_attr(lock_entity, 'friendly_name') }}), wysłano kod."
  - choose: []
    default: !input notify
  # Only a PKI direct message from the sender counts as the answer, so a
  # channel message or broadcast cannot use up the attempt.
  - wait_for_trigger:
      - trigger: event
        event_type: meshtastic_manager_message
        event_data:
          entry_id: !input radio
          from: !input sender
          direct: true
          pki: true
    timeout:
      seconds: "{{ code_timeout }}"
    continue_on_timeout: true
  - choose:
      - conditions:
          - alias: Correct code
            condition: template
            value_template: >-
              {% if wait.trigger %}
                {{ (wait.trigger.event.data.text | trim) == (code | string) }}
              {% else %}false{% endif %}
        sequence:
          - action: lock.unlock
            target:
              entity_id: !input lock_entity
            continue_on_error: true
          - delay:
              seconds: 3
          - action: meshtastic_manager.send_text
            data:
              config_entry_id: "{{ radio }}"
              to: "{{ sender }}"
              text: >-
                {{ 'Otwarto' if is_state(lock_entity, 'unlocked') else 'Błąd: zamek ' ~ states(lock_entity) }}
          - variables:
              notify_message: "Meshtastic: {{ who }} otworzył(a) {{ state_attr(lock_entity, 'friendly_name') }} (stan: {{ states(lock_entity) }})."
          - choose: []
            default: !input notify
          - if:
              - condition: template
                value_template: "{{ relock_minutes | int(0) > 0 }}"
            then:
              - delay:
                  minutes: "{{ relock_minutes | int }}"
              - if:
                  - condition: template
                    value_template: "{{ is_state(lock_entity, 'unlocked') }}"
                then:
                  - action: lock.lock
                    target:
                      entity_id: !input lock_entity
                    continue_on_error: true
                  - action: meshtastic_manager.send_text
                    data:
                      config_entry_id: "{{ radio }}"
                      to: "{{ sender }}"
                      text: "Zamknięto automatycznie"
                  - variables:
                      notify_message: "Meshtastic: {{ state_attr(lock_entity, 'friendly_name') }} zamknięty automatycznie po {{ relock_minutes }} min."
                  - choose: []
                    default: !input notify
    default:
      - action: meshtastic_manager.send_text
        data:
          config_entry_id: "{{ radio }}"
          to: "{{ sender }}"
          text: "Zły kod albo minął czas. Spróbuj za 30 s."
      - variables:
          notify_message: "Meshtastic: NIEUDANA próba otwarcia {{ state_attr(lock_entity, 'friendly_name') }} ({{ who }}) - zły kod albo brak odpowiedzi."
      - choose: []
        default: !input notify
      # Simple rate limit: mode single ignores new attempts meanwhile.
      - delay:
          seconds: 30
