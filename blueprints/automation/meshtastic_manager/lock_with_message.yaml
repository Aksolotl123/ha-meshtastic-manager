blueprint:
  name: Meshtastic - lock with a message
  description: >-
    Locks a lock immediately when a chosen Meshtastic radio sends the lock word
    on a private channel (or as an encrypted direct message). Locking is always
    safe, so no code is required. Use together with "unlock with a one-time
    code".
  domain: automation
  author: Meshtastic Manager
  source_url: https://github.com/Aksolotl123/ha-meshtastic-manager/blob/main/blueprints/automation/meshtastic_manager/lock_with_message.yaml
  input:
    radio:
      name: Home Assistant radio
      selector:
        config_entry:
          integration: meshtastic_manager
    sender:
      name: Allowed sender
      description: Node ID of the radio you carry, for example !a1b2c3d4.
      selector:
        text:
    channel_name:
      name: Channel name
      description: Leave empty to accept only encrypted direct messages.
      default: ""
      selector:
        text:
    lock_entity:
      name: Lock
      selector:
        entity:
          domain: lock
    lock_words:
      name: Lock command
      default:
        - zamknij
        - close
        - lock
      selector:
        text:
          multiple: true
    notify:
      name: Notification
      description: Actions run after locking; the text is in notify_message.
      default: []
      selector:
        action: {}

mode: queued
max: 5

variables:
  radio: !input radio
  sender: !input sender
  channel_name: !input channel_name
  lock_entity: !input lock_entity
  lock_words: !input lock_words
  reply_to: "{{ '' if channel_name else sender }}"

triggers:
  - trigger: event
    event_type: meshtastic_manager_message
    event_data:
      entry_id: !input radio
      from: !input sender

conditions:
  - condition: template
    value_template: >-
      {% set d = trigger.event.data %}
      {% set path_ok = (d.channel_name == channel_name and not d.direct)
         if channel_name else (d.direct and d.pki) %}
      {{ path_ok and (d.text | trim | lower) in (lock_words | map('lower') | list) }}

actions:
  - action: lock.lock
    target:
      entity_id: !input lock_entity
    continue_on_error: true
  - delay:
      seconds: 3
  - action: meshtastic_manager.send_text
    data:
      config_entry_id: "{{ radio }}"
      to: "{{ reply_to }}"
      channel_name: "{{ channel_name }}"
      text: >-
        {{ 'Zamknięto' if is_state(lock_entity, 'locked') else 'Błąd: zamek ' ~ states(lock_entity) }}
  - variables:
      notify_message: "Meshtastic: {{ trigger.event.data.from_name or sender }} zamknął {{ state_attr(lock_entity, 'friendly_name') }} (stan: {{ states(lock_entity) }})."
  - choose: []
    default: !input notify
